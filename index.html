    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { width: 100%; max-width: 450px; height: 100vh; background: #16213e; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; justify-content: space-between; align-items: center; text-align: center; }
        .active { display: flex; }
        
        /* Start Screen */
        #start-screen { justify-content: center; gap: 20px; }
        #start-screen img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 12px; border: 2px solid #0f3460; }
        h1 { font-size: 28px; color: #e94560; margin-bottom: 10px; }
        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; background: #e94560; color: #fff; transition: 0.2s; margin-top: 10px; }
        .btn-main:active { transform: scale(0.98); background: #c0354e; }

        /* HUD Header */
        .hud { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #0f3460; padding: 10px 15px; border-radius: 8px; font-size: 16px; }
        .timer-bar-bg { width: 100%; height: 6px; background: #333; margin: 10px 0; border-radius: 3px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: #e94560; transition: width 1s linear; }

        /* Question Area */
        .flag-container { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: #0f3460; border-radius: 8px; overflow: hidden; border: 2px solid #533483; }
        .flag-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .question-text { font-size: 18px; margin: 10px 0; color: #f1f1f1; }

        /* Options */
        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .btn-opt { padding: 14px; border: 2px solid #533483; border-radius: 8px; background: #16213e; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-opt.correct { background: #2e7d32 !important; border-color: #4caf50 !important; }
        .btn-opt.wrong { background: #c62828 !important; border-color: #ef5350 !important; }

        /* End Screen */
        #end-screen { justify-content: center; gap: 20px; }
    </style>
</head>

// OYUN DURUM DEĞİŞKENLERİ
let currentMode = ''; 
let currentIndex = 0;
let scoreCorrect = 0;
let scoreWrong = 0;
let timer = null;
let timeLeft = 15;
let isAnswered = false;

function saveState() {
    const data = { currentIndex, scoreCorrect, scoreWrong };
    localStorage.setItem(`pop7_${currentMode}`, JSON.stringify(data));
}

function loadState() {
    const saved = localStorage.getItem(`pop7_${currentMode}`);
    if (saved) {
        const data = JSON.parse(saved);
        currentIndex = data.currentIndex || 0;
        scoreCorrect = data.scoreCorrect || 0;
        scoreWrong = data.scoreWrong || 0;
    } else {
        resetState();
    }
}

function resetState() {
    currentIndex = 0;
    scoreCorrect = 0;
    scoreWrong = 0;
    localStorage.removeItem(`pop7_${currentMode}`);
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function showStartScreen() {
    clearInterval(timer);
    showScreen('start-screen');
}

function startGame(mode) {
    currentMode = mode;
    loadState();
    if(currentIndex >= countriesData.length) {
        resetState();
    }
    showScreen('game-screen');
    loadQuestion();
}

function loadQuestion() {
    if (currentIndex >= countriesData.length) {
        finishGame();
        return;
    }

    isAnswered = false;
    document.getElementById('score-correct').innerText = `Doğru: ${scoreCorrect}`;
    document.getElementById('score-wrong').innerText = `Yanlış: ${scoreWrong}`;
    document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${countriesData.length}`;

    const currentItem = countriesData[currentIndex];
    document.getElementById('flag-img').src = `ülkeler/${currentItem.file}`;

    const questionText = document.getElementById('question-text');
    questionText.innerText = currentMode === 'flags' 
        ? "Bu bayrak hangi ülkeye aittir?" 
        : "Bu ülkenin başkenti hangisidir?";

    // Seçenek Oluşturma (1 Doğru, 3 Rastgele Yanlış)
    let correctAnswer = currentMode === 'flags' ? currentItem.name : currentItem.capital;
    let pool = countriesData
        .map(c => currentMode === 'flags' ? c.name : c.capital)
        .filter(ans => ans !== correctAnswer);

    // Rastgele 3 Farklı Seçenek Çek
    pool.sort(() => 0.5 - Math.random());
    let options = [correctAnswer, pool[0], pool[1], pool[2]];
    options.sort(() => 0.5 - Math.random()); // Seçenekleri Karıştır

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt === correctAnswer, btn, correctAnswer);
        optionsContainer.appendChild(btn);
    });

    startTimer();
}

function startTimer() {
    clearInterval(timer);
    timeLeft = 15;
    const bar = document.getElementById('timer-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    
    setTimeout(() => {
        bar.style.transition = 'width 15s linear';
        bar.style.width = '0%';
    }, 50);

    timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(timer);
            if (!isAnswered) {
                handleAnswer(false, null, currentMode === 'flags' ? countriesData[currentIndex].name : countriesData[currentIndex].capital);
            }
        }
    }, 1000);
}

function handleAnswer(isCorrect, selectedBtn, correctAnswer) {
    if (isAnswered) return;
    isAnswered = true;
    clearInterval(timer);

    const buttons = document.querySelectorAll('.btn-opt');
    buttons.forEach(btn => {
        btn.disabled = true;
        if(btn.innerText === correctAnswer) btn.classList.add('correct');
    });

    if (isCorrect) {
        scoreCorrect++;
    } else {
        scoreWrong++;
        if(selectedBtn) selectedBtn.classList.add('wrong');
    }

    currentIndex++;
    saveState();

    setTimeout(() => {
        loadQuestion();
    }, 1200);
}

function finishGame() {
    showScreen('end-screen');
    document.getElementById('final-stats').innerText = `Doğru: ${scoreCorrect} | Yanlış: ${scoreWrong}`;
    // Konfeti Efekti
    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
}

function resetCurrentGame() {
    resetState();
    startGame(currentMode);
}
</script>
</body>
</html>
