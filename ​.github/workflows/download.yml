name: Gorselleri Otomatik Indir

on:
  workflow_dispatch: # Manuel çalıştırma butonu ekler

permissions:
  contents: write # Repoya yeni klasör ve dosya yazma izni

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install pandas openpyxl requests

      - name: Scripti Çalıştır
        run: |
          python download_assets.py

      - name: Görselleri Repoya Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iller/ tarihieserler/
          git commit -m "Görseller otomatik indirildi" || exit 0
          git push
