name: UNESCO Gorsellerini Otomatik Indir

on:
  push:
    branches: [main, master]
    paths:
      - "download_assets.py"
      - ".github/workflows/download.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

concurrency:
  group: unesco-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri Yukle
        run: pip install requests pillow

      - name: Guncel Main Dalini Al
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: UNESCO Verilerini ve Gorselleri Indir
        run: python download_assets.py

      - name: Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "ülkeler" "unesco dünya mirasları" "data"

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi

          git commit -m "UNESCO dunya mirasi verilerini guncelle"

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Main dalinda yeni degisiklik bulundu."
            echo "UNESCO verileri guncel main uzerinde yeniden olusturulacak."

            git reset --hard origin/main

            python download_assets.py

            git add -A -- "ülkeler" "unesco dünya mirasları" "data"

            if git diff --cached --quiet; then
              echo "Yeniden indirme sonrasi degisiklik yok."
              exit 0
            fi

            git commit -m "UNESCO dunya mirasi verilerini guncelle"
          fi

          git push origin HEAD:main
