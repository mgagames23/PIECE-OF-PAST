name: UNESCO Gorsellerini Otomatik Indir

on:
  push:
    branches: [main, master]
    paths:
      - "download_assets.py"
      - ".github/workflows/download.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"


permissions:
  contents: write


concurrency:
  group: unesco-download
  cancel-in-progress: false


jobs:

  # ==========================================================
  # 1. ULKE BAYRAKLARI
  # ==========================================================

  countries:
    name: "1 - Ulke Bayraklari"
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # DEPLOY
      # --------------------------------------------------------

      - name: Depoyu Klonla
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # PYTHON
      # --------------------------------------------------------

      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # KUTUPHANELER
      # --------------------------------------------------------

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow


      # --------------------------------------------------------
      # GUNCEL MAIN'I AL
      #
      # ONEMLI:
      # Reset once burada yapiliyor.
      # Bundan SONRA eski bayraklar temizleniyor.
      # Boylece reset eski bayraklari geri getirmiyor.
      # --------------------------------------------------------

      - name: Guncel Main Dalini Al
        run: |
          git fetch origin main
          git reset --hard origin/main


      # --------------------------------------------------------
      # ESKI ULKE GORSELLERINI TEMIZLE
      # --------------------------------------------------------

      - name: Eski Ulke Bayraklarini Temizle
        run: |
          echo "Eski ulke bayraklari temizleniyor..."

          if [ -d "ülkeler" ]; then
            find "ülkeler" -type f \
              \( \
                -iname "*.jpg" \
                -o -iname "*.jpeg" \
                -o -iname "*.png" \
                -o -iname "*.webp" \
              \) \
              -delete
          fi

          mkdir -p "ülkeler"

          echo "Ulke klasoru hazir."
          echo "Yeni standart bayraklar indirilecek."


      # --------------------------------------------------------
      # STANDART ULKE BAYRAKLARINI INDIR
      # --------------------------------------------------------

      - name: Standart Ulke Bayraklarini Indir
        run: |
          python download_assets.py countries


      # --------------------------------------------------------
      # ULKE BAYRAKLARINI KONTROL ET
      # --------------------------------------------------------

      - name: Ulke Bayraklarini Kontrol Et
        run: |

          COUNT=$(find "ülkeler" -type f -iname "*.jpg" | wc -l)

          echo "Bulunan JPG bayrak sayisi: $COUNT"

          if [ "$COUNT" -lt 174 ]; then
            echo "HATA: 174 ulke bayraginin tamami bulunamadi."
            exit 1
          fi

          echo "174 ulke bayragi mevcut."


      # --------------------------------------------------------
      # COMMIT
      # --------------------------------------------------------

      - name: Ulke Bayraklarini Commit Et
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "ülkeler" "data"

          if git diff --cached --quiet; then
            echo "Ulke bayraklarinda degisiklik yok."
            exit 0
          fi

          git commit -m "Standart ulke bayraklarini guncelle"


      # --------------------------------------------------------
      # PUSH
      #
      # Eger bu sirada main degismisse:
      #
      # 1. Guncel main al
      # 2. Eski bayraklari tekrar temizle
      # 3. Bayraklari tekrar indir
      # 4. Commit
      # 5. Push
      # --------------------------------------------------------

      - name: Ulke Degisikliklerini Push Et
        run: |

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then

            echo "Main dalinda yeni degisiklik bulundu."
            echo "Guncel main yeniden alinacak."

            git reset --hard origin/main


            echo "Eski ulke bayraklari yeniden temizleniyor..."

            if [ -d "ülkeler" ]; then
              find "ülkeler" -type f \
                \( \
                  -iname "*.jpg" \
                  -o -iname "*.jpeg" \
                  -o -iname "*.png" \
                  -o -iname "*.webp" \
                \) \
                -delete
            fi

            mkdir -p "ülkeler"


            echo "174 standart bayrak yeniden indiriliyor..."

            python download_assets.py countries


            COUNT=$(find "ülkeler" -type f -iname "*.jpg" | wc -l)

            echo "Bulunan JPG bayrak sayisi: $COUNT"

            if [ "$COUNT" -lt 174 ]; then
              echo "HATA: 174 ulke bayraginin tamami bulunamadi."
              exit 1
            fi


            git add -A -- "ülkeler" "data"

            if git diff --cached --quiet; then
              echo "Yeniden indirme sonrasi degisiklik yok."
              exit 0
            fi

            git commit -m "Standart ulke bayraklarini guncelle"

          fi

          git push origin HEAD:main



