name: UNESCO Gorsellerini Otomatik Indir

on:
  push:
    branches: [main, master]
    paths:
      - "download_assets.py"
      - ".github/workflows/download.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

concurrency:
  group: unesco-download
  cancel-in-progress: false


jobs:

  # ==========================================================
  # 1. ÖNCE ÜLKELER
  # ==========================================================

  countries:
    name: 1 - Ulke Gorselleri
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu Klonla
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Guncel Main Dalini Al
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Ulke Gorsellerini Indir
        run: |
          python download_assets.py countries

      - name: Ulke Degisikliklerini Commit Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "ülkeler" "unesco dünya mirasları" "data"

          if git diff --cached --quiet; then
            echo "Ulke asamasinda yeni degisiklik yok."
            exit 0
          fi

          git commit -m "UNESCO ulke gorsellerini guncelle"

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Main dalinda yeni degisiklik bulundu."
            echo "Push islemi icin guncel main tekrar alinacak."

            git reset --hard origin/main

            python download_assets.py countries

            git add -A -- "ülkeler" "unesco dünya mirasları" "data"

            if git diff --cached --quiet; then
              echo "Yeniden calistirma sonrasi degisiklik yok."
              exit 0
            fi

            git commit -m "UNESCO ulke gorsellerini guncelle"
          fi

          git push origin HEAD:main


