name: UNESCO Gorsellerini Indir

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"

  push:
    branches:
      - main
    paths:
      - "download_assets.py"
      - ".github/workflows/download.yml"

permissions:
  contents: write

concurrency:
  group: unesco-download
  cancel-in-progress: false


jobs:

  # ==========================================================
  # 1. PARÇA
  # ==========================================================

  unesco_1:
    name: UNESCO 1. Parca

    runs-on: ubuntu-latest

    steps:

      - name: Repository Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Gereksinimleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Main Dalini Guncelle
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: UNESCO 1. Parcayi Indir
        run: |
          python download_assets.py unesco-1

      - name: Dosyalari Kontrol Et
        run: |
          echo "UNESCO JPG sayisi:"
          find "unesco dünya mirasları" \
            -type f \
            \( -iname "*.jpg" -o -iname "*.jpeg" \) \
            | wc -l

      - name: Degisiklikleri Commit Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "unesco dünya mirasları" data

          if git diff --cached --quiet; then
            echo "Commit edilecek degisiklik yok."
            exit 0
          fi

          git commit -m "UNESCO 1. parca gorsellerini guncelle"

      - name: GitHub'a Push
        run: |
          git fetch origin main
          git rebase origin/main || true
          git push origin HEAD:main


