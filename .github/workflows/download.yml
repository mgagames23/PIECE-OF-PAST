name: UNESCO Gorsellerini Otomatik Indir

on:
  push:
    branches: [main, master]
    paths:
      - "download_assets.py"
      - ".github/workflows/download.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"


permissions:
  contents: write


concurrency:
  group: unesco-download
  cancel-in-progress: false


jobs:

  # ==========================================================
  # 1. ULKELER
  # ==========================================================

  countries:
    name: "1 - Ulke Bayraklari"
    runs-on: ubuntu-latest

    steps:

      - name: Depoyu Klonla
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow


      # --------------------------------------------------------
      # Eski Wikimedia bayraklarini temizle
      # --------------------------------------------------------

      - name: Eski Ulke Bayraklarini Temizle
        run: |
          echo "Eski ulke bayraklari temizleniyor..."

          if [ -d "ülkeler" ]; then
            find "ülkeler" -type f \
              \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
              -delete
          fi

          mkdir -p "ülkeler"

          echo "Ulke klasoru hazir."


      # --------------------------------------------------------
      # Güncel main
      # --------------------------------------------------------

      - name: Guncel Main Dalini Al
        run: |
          git fetch origin main
          git reset --hard origin/main


      # --------------------------------------------------------
      # Ülke bayraklarını indir
      # --------------------------------------------------------

      - name: Ulke Bayraklarini Indir
        run: |
          python download_assets.py countries


      # --------------------------------------------------------
      # Ülke kontrolü
      #
      # Script zaten eksik ülke varsa hata veriyor.
      # Bu adım ekstra güvenlik kontrolüdür.
      # --------------------------------------------------------

      - name: Ulke Bayraklarini Kontrol Et
        run: |
          COUNT=$(find "ülkeler" -type f -iname "*.jpg" | wc -l)

          echo "Bulunan JPG bayrak sayisi: $COUNT"

          if [ "$COUNT" -lt 174 ]; then
            echo "HATA: 174 ulke bayraginin tamami bulunamadi."
            exit 1
          fi

          echo "Ulke bayraklari tamam."


      # --------------------------------------------------------
      # Commit / Push
      # --------------------------------------------------------

      - name: Ulke Bayraklarini Commit Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "ülkeler" "data"

          if git diff --cached --quiet; then
            echo "Ulke bayraklarinda degisiklik yok."
            exit 0
          fi

          git commit -m "Standart ulke bayraklarini guncelle"


      # --------------------------------------------------------
      # Push sırasında main değişmişse güncelle
      # --------------------------------------------------------

      - name: Ulke Degisikliklerini Push Et
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Main dalinda yeni degisiklik bulundu."
            echo "Guncel main yeniden alinacak."

            git reset --hard origin/main

            # Main'den sonra ülke bayraklarını tekrar oluştur.
            # Eski bayrakları tekrar temizle.
            if [ -d "ülkeler" ]; then
              find "ülkeler" -type f \
                \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) \
                -delete
            fi

            mkdir -p "ülkeler"

            python download_assets.py countries

            COUNT=$(find "ülkeler" -type f -iname "*.jpg" | wc -l)

            echo "Bulunan JPG bayrak sayisi: $COUNT"

            if [ "$COUNT" -lt 174 ]; then
              echo "HATA: 174 ulke bayraginin tamami bulunamadi."
              exit 1
            fi

            git add -A -- "ülkeler" "data"

            if git diff --cached --quiet; then
              echo "Yeniden indirme sonrasi degisiklik yok."
              exit 0
            fi

            git commit -m "Standart ulke bayraklarini guncelle"
          fi

          git push origin HEAD:main


  # ==========================================================
  # 2. UNESCO 1
  # 1 - 424
