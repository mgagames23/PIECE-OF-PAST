name: Build PIECE OF PAST 7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository'yi indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      # 3. Java 17 - Capacitor 5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. NPM paketlerini kur
      - name: Install dependencies
        run: npm install

      # 5. Web uygulamasını oluştur
      - name: Build web app
        run: npm run build

      # 6. Web dosyalarının oluştuğunu kontrol et
      - name: Check web build
        run: |
          echo "www klasörü:"
          ls -lah www

          echo ""
          echo "Ülkeler klasörü:"
          ls -lah www/ülkeler | head -20

          test -f www/index.html
          test -f www/oyun.jpg

          echo "Web build başarılı."

      # 7. Android platformunu oluştur
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android klasörü zaten mevcut."
          fi

      # 8. Capacitor sync
      - name: Capacitor sync
        run: npx cap sync android

      # 9. Launcher ikonlarını kopyala
      - name: Install custom launcher icons
        run: |
          echo "Installing custom launcher icons..."

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp android-icons/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp android-icons/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp android-icons/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp android-icons/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp android-icons/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android-icons/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android-icons/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android-icons/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android-icons/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android-icons/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Launcher icons installed."

      # 10. Çakışan adaptive ikonları kaldır
      - name: Remove conflicting adaptive launcher icons
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

      # 11. APK oluştur
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 12. APK'yı Artifact olarak yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piece-of-past-7-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 13. GitHub Release oluştur
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PIECE OF PAST 7 - Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
